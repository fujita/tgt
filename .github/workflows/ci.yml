name: ci

on: [pull_request]

jobs:
  build_ubuntu:
    name: build on Ubuntu
    runs-on: ubuntu-26.04
    steps:
      - name: checking out
        uses: actions/checkout@v7
        with:
          path: tgt
      - name: build
        working-directory: tgt
        run: |
          make
  build_alpine:
    name: build on Alpine Linux
    runs-on: ubuntu-26.04
    container: alpine:latest
    steps:
      - name: install build dependencies
        run: apk add --no-cache build-base linux-headers libaio-dev
      - name: checking out
        uses: actions/checkout@v7
        with:
          path: tgt
      - name: build
        working-directory: tgt
        run: |
          make
